<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | NSE desk</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login">
    <div class="panel">
      <span class="wordmark">NSE<span>desk</span></span>
      <p class="muted">Your Nairobi Securities Exchange research desk.</p>
      {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf(request) }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required autofocus>
        </label>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
