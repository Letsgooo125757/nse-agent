name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nse
          POSTGRES_PASSWORD: nse
          POSTGRES_DB: nse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nse"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nse:nse@localhost:5432/nse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
