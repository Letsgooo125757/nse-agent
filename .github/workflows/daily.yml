# Weekday update for the hosted database: news, AI news notes, prices (best effort) and alerts.
# Runs at 12:30 UTC = 15:30 Nairobi, after the NSE closes.
# Needs the repository secret DATABASE_URL (Settings > Secrets and variables > Actions).
#
# Prices come from the Mansa API when the MANSA_API_KEY secret is set (it works
# from GitHub's servers). Without it the job falls back to afx.kwayisi.org, which
# blocks GitHub's data-centre network, so prices then come from your own computer
# (see DEPLOY.md, step 5). A failed price step shows a warning rather than failing the job.
name: daily-update

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HTTP_USER_AGENT: ${{ vars.HTTP_USER_AGENT || 'nse-agent/0.1 (personal research project)' }}
      HTTP_TIMEOUT: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Check the secret is set
        run: test -n "$DATABASE_URL" || (echo "Add the DATABASE_URL repository secret first." && exit 1)
      - run: nse-agent init-db        # applies any schema upgrades; safe to repeat
      - name: Prices (best effort)
        continue-on-error: true
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: |
          nse-agent ingest-prices || {
            echo "::warning title=Prices not fetched::Add the MANSA_API_KEY secret (DEPLOY.md step 4), or rely on your computer's scheduled 'nse-agent ingest-prices' (step 5)."
            exit 1
          }
      - run: nse-agent ingest-news
      - name: AI notes on news about your companies
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nse-agent analyze-news --optional
      - run: nse-agent alerts run
      - run: nse-agent status
