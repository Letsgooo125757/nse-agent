[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-agent"
version = "0.1.0"
description = "Data pipeline for a personal NSE (Kenya) investment research copilot"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1.4"]

[project.scripts]
nse-agent = "nse_agent.cli:main"

[tool.setuptools]
packages = ["nse_agent", "nse_agent.sources"]

[tool.setuptools.package-data]
nse_agent = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
