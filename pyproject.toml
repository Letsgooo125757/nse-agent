[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-agent"
version = "0.1.0"
description = "Data pipeline for a personal NSE (Kenya) investment research copilot"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "psycopg-pool>=3.2",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "pgserver>=0.1.4",   # embedded Postgres for DATABASE_URL=embedded (no Docker)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nse-agent = "nse_agent.cli:main"

[tool.setuptools]
packages = ["nse_agent", "nse_agent.sources", "nse_agent.agent", "nse_agent.web"]

[tool.setuptools.package-data]
nse_agent = ["data/*.csv", "data/*.json", "data/*.sql"]
"nse_agent.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
